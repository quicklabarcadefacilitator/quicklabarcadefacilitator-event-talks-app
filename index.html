<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Talk Event</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .search-box { margin-bottom: 20px; }
        .talk-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .talk-time { font-weight: bold; color: #555; }
        .break { font-style: italic; color: #777; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>Tech Talk Event Schedule</h1>
    </header>

    <div class="search-box">
        <input type="text" id="categorySearch" placeholder="Search by category...">
    </div>

    <div id="scheduleContainer"></div>

    <script>
        const talks = [
            { time: "10:00 AM", title: "Introduction to AI", speaker: "Alice Smith", category: "AI, ML", duration: "1h", description: "Learn basics of AI." },
            { time: "11:10 AM", title: "Web Accessibility 101", speaker: "Bob Johnson", category: "Web, Accessibility", duration: "1h", description: "Making web inclusive." },
            { time: "12:20 PM", title: "Cloud Native Patterns", speaker: "Charlie Davis", category: "Cloud, DevOps", duration: "1h", description: "Scalable architecture." },
            { time: "02:30 PM", title: "Advanced React", speaker: "Eve White", category: "Web, React", duration: "1h", description: "Beyond components." },
            { time: "03:40 PM", title: "Security Best Practices", speaker: "Frank Green", category: "Security", duration: "1h", description: "Safe development." },
            { time: "04:50 PM", title: "Future of Data", speaker: "Grace Hopper", category: "Data, AI", duration: "1h", description: "Data trends." }
        ];

        function renderSchedule(filter = "") {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';
            
            let currentTimeIndex = 0;
            const timeline = [
                { type: 'talk', data: talks[0] },
                { type: 'break', label: '11:00 AM - 11:10 AM (Break)' },
                { type: 'talk', data: talks[1] },
                { type: 'break', label: '12:10 PM - 12:20 PM (Break)' },
                { type: 'talk', data: talks[2] },
                { type: 'break', label: '01:20 PM - 02:30 PM (Lunch)' },
                { type: 'talk', data: talks[3] },
                { type: 'break', label: '03:30 PM - 03:40 PM (Break)' },
                { type: 'talk', data: talks[4] },
                { type: 'break', label: '04:40 PM - 04:50 PM (Break)' },
                { type: 'talk', data: talks[5] }
            ];

            timeline.forEach(item => {
                if (item.type === 'talk') {
                    const talk = item.data;
                    if (talk.category.toLowerCase().includes(filter.toLowerCase())) {
                        container.innerHTML += `
                            <div class="talk-card">
                                <div class="talk-time">${talk.time}</div>
                                <h3>${talk.title}</h3>
                                <p><strong>Speaker:</strong> ${talk.speaker}</p>
                                <p><strong>Category:</strong> ${talk.category}</p>
                                <p>${talk.description}</p>
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML += `<div class="break">${item.label}</div>`;
                }
            });
        }

        document.getElementById('categorySearch').addEventListener('input', (e) => {
            renderSchedule(e.target.value);
        });

        renderSchedule();
    </script>
</body>
</html>
